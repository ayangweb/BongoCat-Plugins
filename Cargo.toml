[workspace]
resolver = "3"
members = [
    "crates/bongocat-plugin-sdk",
    "crates/bongocat-plugin-packaging",
    "plugins/pomodoro",
    "plugins/key-sounds",
    "plugins/input-source",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/ayangweb/BongoCat-Plugins"
publish = false

[workspace.dependencies]
base64 = "=0.23.1"
libc = "=0.2.190"
minisign = "=0.10.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFDictionary", "CFNotificationCenter", "CFRunLoop", "CFString", "CFURL"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSURL", "NSString"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "flac"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }

bongocat-plugin-sdk = { path = "crates/bongocat-plugin-sdk" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
